packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  unrs-resolver: true
# SDK 57 versions below are the revert path for the temporary SDK 54 trial (G-16) - do not remove
# until the human confirms SDK 57 is back for good. See docs/scaffold-handover.md for the full table.
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.21'
  - '@expo/fingerprint@0.20.12'
  - '@expo/metro-runtime@57.0.15'
  - '@expo/router-server@57.0.9'
  - '@expo/ui@57.0.15'
  - babel-preset-expo@57.0.10
  - expo-asset@57.0.16
  - expo-constants@57.0.17
  - expo-font@57.0.3
  - expo-image@57.0.4
  - expo-linking@57.0.9
  - expo-modules-core@57.0.15
  - expo-modules-jsi@57.0.7
  - expo-router@57.0.18
  - expo@57.0.19
